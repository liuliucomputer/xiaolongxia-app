<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小龙虾 - AI 助手</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <!-- 登录/注册页面 -->
  <div id="auth-page" class="page active">
    <div class="auth-container">
      <div class="auth-box">
        <div class="auth-header">
          <h1>🦞 小龙虾</h1>
          <p>你的 AI 智能助手</p>
        </div>

        <div class="auth-tabs">
          <button class="tab active" data-tab="login">登录</button>
          <button class="tab" data-tab="register">注册</button>
        </div>

        <!-- 登录表单 -->
        <form id="login-form" class="auth-form active">
          <div class="form-group">
            <label>账号</label>
            <input type="text" id="login-account" placeholder="手机号/邮箱/用户名" required>
          </div>
          <div class="form-group">
            <label>密码</label>
            <input type="password" id="login-password" placeholder="请输入密码" required>
          </div>
          <button type="submit" class="btn btn-primary">登录</button>
          <p class="hint-text">管理员账号: admin / liuliu</p>
        </form>

        <!-- 注册表单 -->
        <form id="register-form" class="auth-form">
          <div class="register-method-tabs">
            <button type="button" class="method-tab active" data-method="phone">手机号注册</button>
            <button type="button" class="method-tab" data-method="email">邮箱注册</button>
          </div>

          <!-- 手机号注册 -->
          <div id="phone-register" class="register-method active">
            <div class="form-group">
              <label>手机号</label>
              <input type="tel" id="reg-phone" placeholder="请输入手机号" required>
            </div>
            <div class="form-group">
              <label>验证码</label>
              <div class="code-input-group">
                <input type="text" id="reg-phone-code" placeholder="请输入验证码" required>
                <button type="button" class="btn-code" id="send-phone-code">获取验证码</button>
              </div>
            </div>
          </div>

          <!-- 邮箱注册 -->
          <div id="email-register" class="register-method">
            <div class="form-group">
              <label>邮箱</label>
              <input type="email" id="reg-email" placeholder="请输入邮箱" required>
            </div>
            <div class="form-group">
              <label>验证码</label>
              <div class="code-input-group">
                <input type="text" id="reg-email-code" placeholder="请输入验证码" required>
                <button type="button" class="btn-code" id="send-email-code">获取验证码</button>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>用户名</label>
            <input type="text" id="reg-username" placeholder="请输入用户名" required>
          </div>
          <div class="form-group">
            <label>密码</label>
            <input type="password" id="reg-password" placeholder="请设置密码（至少6位）" required>
          </div>
          <button type="submit" class="btn btn-primary">注册</button>
        </form>
      </div>
    </div>
  </div>

  <!-- 主应用页面 -->
  <div id="main-page" class="page">
    <!-- 顶部导航栏 -->
    <header class="topbar">
      <button class="menu-toggle" id="menu-toggle">
        <i class="fas fa-bars"></i>
      </button>
      <h2>小龙虾</h2>
      <div class="topbar-right">
        <button class="btn-icon" id="vip-btn" title="VIP中心"><i class="fas fa-crown"></i></button>
        <button class="btn-icon" id="user-menu-btn" title="用户菜单"><i class="fas fa-user"></i></button>
      </div>
    </header>

    <!-- 主内容区 -->
    <div class="main-container">
      <!-- 侧边栏 -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <h3>菜单</h3>
        </div>
        <nav class="sidebar-nav">
          <button class="sidebar-tab active" data-view="conversations">
            <i class="fas fa-comments"></i> 对话
          </button>
          <button class="sidebar-tab" data-view="agents">
            <i class="fas fa-robot"></i> Agent
          </button>
        </nav>
        <div class="sidebar-footer">
          <button class="new-chat-btn" id="new-chat-btn">
            <i class="fas fa-plus"></i> 新建对话
          </button>
        </div>
      </aside>

      <!-- 对话视图 -->
      <main class="view active" id="conversations-view">
        <div class="conversation-list" id="conversation-list">
          <div class="empty-state">
            <i class="fas fa-comments"></i>
            <p>还没有对话，点击"新建对话"开始吧</p>
          </div>
        </div>
        <div class="chat-container" id="chat-container" style="display:none">
          <div class="chat-header">
            <button class="back-btn" id="back-btn"><i class="fas fa-arrow-left"></i></button>
            <h3 id="chat-title">新对话</h3>
          </div>
          <div class="chat-messages" id="chat-messages"></div>
          <div class="chat-input-area">
            <textarea id="chat-input" placeholder="输入消息..." rows="1"></textarea>
            <button class="send-btn" id="send-btn"><i class="fas fa-paper-plane"></i></button>
          </div>
        </div>
      </main>

      <!-- Agent 视图 -->
      <main class="view" id="agents-view">
        <div class="agent-tabs">
          <button class="agent-tab active" data-agent-tab="my-agents">我的 Agent</button>
          <button class="agent-tab" data-agent-tab="browse-agents">发现 Agent</button>
        </div>
        <div class="agent-content">
          <div class="agent-section active" id="my-agents-section">
            <button class="create-agent-btn" id="create-agent-btn">
              <i class="fas fa-plus"></i> 创建 Agent
            </button>
            <div class="agent-list" id="my-agents-list"></div>
          </div>
          <div class="agent-section" id="browse-agents-section">
            <div class="agent-list" id="browse-agents-list"></div>
          </div>
        </div>
      </main>

      <!-- Agent 聊天视图 -->
      <main class="view" id="agent-chat-view">
        <div class="chat-container">
          <div class="chat-header">
            <button class="back-btn" id="agent-back-btn"><i class="fas fa-arrow-left"></i></button>
            <h3 id="agent-chat-title">Agent 聊天</h3>
          </div>
          <div class="chat-messages" id="agent-chat-messages"></div>
          <div class="chat-input-area">
            <textarea id="agent-chat-input" placeholder="输入消息..." rows="1"></textarea>
            <button class="send-btn" id="agent-send-btn"><i class="fas fa-paper-plane"></i></button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- 弹窗组件 -->
  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal" id="modal-content"></div>
  </div>

  <!-- 提示消息 -->
  <div id="toast" class="toast" style="display:none"></div>

  <script src="/js/app.js"></script>
</body>
</html>
