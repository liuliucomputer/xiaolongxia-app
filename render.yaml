services:
  - type: web
    name: xiaolongxia-api
    env: node
    buildCommand: npm install
    startCommand: node server/index.js
    envVars:
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /opt/render/workspace/data
    disk:
      name: data
      mountPath: /opt/render/workspace/data
      sizeGB: 1
