services:
  - type: web
    name: xiaolongxia-app
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    autoDeploy: true

databases:
  - name: xiaolongxia-db
    env: postgres
    plan: free
