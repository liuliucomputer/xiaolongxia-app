services:
  - type: web
    name: xiaolongxia-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
  - type: postgres
    name: xiaolongxia-db
    region: oregon
    plan: free
    ipAllowList: []
